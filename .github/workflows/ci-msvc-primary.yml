---
name: CI - MSVC primary

on:
  push:
    branches: [ main, pre-flight ]
  pull_request:
    branches: [ main, pre-flight ]

jobs:
  windows-debug:
    name: Windows - MSVC - Sharded
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v3

      - name: Run runner self-tests
        shell: pwsh
        run: .\tests\runner\run_runner_self_tests.ps1

      - name: Build FlashCppMSVC project (Sharded)
        shell: powershell
        run: |
          # Build only the FlashCppMSVC project with MSBuild (Sharded) - uses MSVC toolset
          msbuild FlashCppMSVC.vcxproj /p:Configuration=Sharded /p:Platform=x64 /m

      - name: Test Reference Files (Compile & Link)
        shell: pwsh
        run: |
          # Run the reference files test script with parallel execution (default: all logical cores)
          # Requires PowerShell 7+ (pwsh) for ForEach-Object -Parallel support
          .\tests\run_all_tests.ps1 -Jobs 4
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Reference files test failed!" -ForegroundColor Red
            exit 1
          }

      - name: Migration counter baselines
        shell: pwsh
        run: |
          # Enforce directional migration counters over the fixed corpus
          # (architecture boundary 0; removal target for the outside-engine
          # diagnostic counter is architecture boundary 11).
          .\tests\run_migration_counters.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Migration counter check failed!" -ForegroundColor Red
            exit 1
          }
