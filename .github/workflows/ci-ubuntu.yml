---
name: CI - Ubuntu

on:
  push:
    branches: [ main, pre-flight ]
  pull_request:
    branches: [ main, pre-flight ]

jobs:
  ubuntu-build-test:
    name: Ubuntu - Clang - Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run Runner Self-Tests
        run: bash tests/runner/run_runner_self_tests.sh

      - name: Canonical type identity and mutation guards
        run: python3 tests/architecture/run_canonical_types.py --mutations

      - name: Build FlashCpp with Make
        run: |
          make sharded -j$(nproc) CXX=clang++
          mkdir -p x64/Debug
          ln -sf ../Sharded/FlashCpp x64/Debug/FlashCpp

      - name: Check ELF unwind records and multi-TU link orders
        run: bash tests/runner/run_elf_eh_frame_tests.sh

      - name: Run All Tests
        run: |
          # Run the test script which compiles and links all .cpp files in tests/
          # and fails the build if any compilation or linking errors occur
          bash tests/run_all_tests.sh

      - name: Migration counter baselines
        run: |
          bash tests/run_migration_counters.sh
          bash tests/run_migration_dollar_inventory.sh
