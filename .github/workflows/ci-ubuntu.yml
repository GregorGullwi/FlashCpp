---
name: CI - Ubuntu

on:
  push:
    branches: [ main, pre-flight ]
  pull_request:
    branches: [ main, pre-flight ]

jobs:
  ubuntu-build-test:
    name: Ubuntu - Clang - Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run Runner Self-Tests
        run: bash tests/runner/run_runner_self_tests.sh

      - name: Build FlashCpp with Make
        run: |
          make sharded -j$(nproc) CXX=clang++
          mkdir -p x64/Debug
          ln -sf ../Sharded/FlashCpp x64/Debug/FlashCpp

      - name: Run All Tests
        run: |
          # Run the test script which compiles and links all .cpp files in tests/
          # and fails the build if any compilation or linking errors occur
          bash tests/run_all_tests.sh

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Migration counter baselines
        shell: pwsh
        run: |
          ./tests/run_migration_counters.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Migration counter check failed!" -ForegroundColor Red
            exit 1
          }
          ./tests/run_migration_dollar_inventory.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Dollar inventory check failed!" -ForegroundColor Red
            exit 1
          }
